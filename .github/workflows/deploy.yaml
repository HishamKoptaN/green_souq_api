name: Continuous Deployment
on:
  push:
    branches:
      - prod
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.branch || github.ref_name }}
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            cd ${{ vars.PROJECT_PATH }}
            git checkout .
            git fetch origin ${{ inputs.branch || github.ref_name }}
            git reset --hard origin/${{ inputs.branch || github.ref_name }}
            if [ -f .env.${{ inputs.branch || github.ref_name }} ]; then cp .env.${{ inputs.branch || github.ref_name }} .env; fi
            mkdir -p storage/app/firebase
            if [ "${{ inputs.branch || github.ref_name }}" = "prod" ]; then
              printf '%s' '${{ secrets.FIREBASE_PROD_SDK_B64 }}' | base64 -d > storage/app/firebase/prod-firebase_admin_sdk.json
              chmod 600 storage/app/firebase/prod-firebase_admin_sdk.json
              sed -i 's|^FIREBASE_ADMIN_SDK_PATH=.*|FIREBASE_ADMIN_SDK_PATH=app/firebase/prod-firebase_admin_sdk.json|' .env
            else
              printf '%s' '${{ secrets.FIREBASE_DEV_SDK_B64 }}' | base64 -d > storage/app/firebase/dev-firebase_admin_sdk.json
              chmod 600 storage/app/firebase/dev-firebase_admin_sdk.json
              sed -i 's|^FIREBASE_ADMIN_SDK_PATH=.*|FIREBASE_ADMIN_SDK_PATH=app/firebase/dev-firebase_admin_sdk.json|' .env
            fi
            composer install --optimize-autoloader --no-dev --ignore-platform-reqs --no-scripts
            php artisan down --retry=60
            php artisan migrate --force
            composer dump-autoload --optimize --no-scripts
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan db:seed --class="DatabaseSeeder" --force
            php artisan up