name: Continuous Deployment
on:
  push:
    branches:
      - dev
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            mkdir -p domains/springgreen-turtle-355093.hostingersite.com/public_html
            cd ${{ vars.PROJECT_PATH }}
            if [ ! -d ".git" ]; then
            git clone -b ${{ github.ref_name }} "https://HishamKoptaN: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@github.com/HishamKoptaN/green_souq_api.git" .
            fi
            git checkout .
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            cp .env.${{ github.ref_name }} .env 
            composer install --optimize-autoloader --no-dev --ignore-platform-reqs --no-scripts
            php artisan down --retry=60
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            composer dump-autoload
            php artisan up
            # php artisan db:seed --class="DatabaseSeeder" --force