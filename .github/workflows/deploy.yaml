name: Continuous Deployment
on:
  push:
    branches:
      - dev
      - prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ vars.SSH_PORT }}
          script: |
            set -e
            mkdir -p domains/springgreen-turtle-355093.hostingersite.com/public_html/api
            cd ${{ vars.PROJECT_PATH }}
            git clone -b ${{ github.ref_name }} --depth 1 "https://HishamKoptaN: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@github.com/HishamKoptaN/green_souq_api.git" .
            cp .env.${{ github.ref_name }} .env 
            php artisan down --retry=60
            php artisan migrate --force
            composer dump-autoload --optimize --no-scripts
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            # php artisan db:seed --class="DatabaseSeeder" --force
            php artisan up